services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beancraft
      POSTGRES_USER: beancraft
      POSTGRES_PASSWORD: beancraft
    ports:
      - "5432:5432"
    volumes:
      - beancraft-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beancraft -d beancraft"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  beancraft-postgres: