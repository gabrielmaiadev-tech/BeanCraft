spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/beancraft}
    username: ${DB_USERNAME:beancraft}
    password: ${DB_PASSWORD:beancraft}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html